[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intellipage-backend"
version = "0.2.1"
description = "Administrator-level Windows memory and workload optimization backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mysql-connector-python>=9.0,<27",
  "oracledb>=3.0,<4",
  "numpy>=1.26,<3",
  "psutil>=5.9,<8",
  "python-dotenv>=1.0,<2",
  "torch>=2.2,<3",
  "Pillow>=10,<13",
]

[project.scripts]
intellipage = "intellipage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

